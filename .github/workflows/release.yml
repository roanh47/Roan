name: Release

# Build every release artifact in CI. Nothing here runs on a developer machine.
# Triggers on a version tag push, e.g. `git tag v0.0.1 && git push origin v0.0.1`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  APP_VERSION: "0.0.1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- Windows --
  # NSIS gives a single self-contained .exe installer (MSI would give a .msi).
  windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build web UI bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then
            npm --prefix web ci --no-audit --no-fund
          else
            npm --prefix web install --no-audit --no-fund
          fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"
          du -sh web/dist

      - name: Build Tauri app and NSIS installer
        shell: bash
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis --verbose

      - name: Collect exactly one artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          exe="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' | head -n 1)"
          test -n "$exe" || { echo "::error::NSIS produced no .exe"; exit 1; }
          cp "$exe" "out/Roan-${APP_VERSION}-x64.exe"
          # Drop every other bundler output so nothing else can reach the release.
          rm -rf src-tauri/target/release/bundle
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/Roan-0.0.1-x64.exe
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ macOS --
  # Apple Silicon only. A universal Mach-O would double the size for Intel Macs
  # nobody runs this on.
  # Unsigned: no Apple secrets required, users get a Gatekeeper prompt.
  macos:
    name: macOS Apple Silicon (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-arm64

      - name: Build web UI bundle
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else npm --prefix web install --no-audit --no-fund; fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"

      - name: Build Tauri app and DMG (unsigned)
        run: npx --yes @tauri-apps/cli@^2 build --target aarch64-apple-darwin --bundles dmg --verbose

      - name: Collect exactly one artifact
        run: |
          set -euo pipefail
          mkdir -p out
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$dmg" || { echo "::error::DMG bundler produced no .dmg"; exit 1; }
          cp "$dmg" "out/Roan-${APP_VERSION}-arm64.dmg"
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/Roan-0.0.1-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ Linux --
  linux:
    name: Linux x86_64 (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK and AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf libfuse2 file xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: linux-x86_64

      - name: Build web UI bundle
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else npm --prefix web install --no-audit --no-fund; fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"

      - name: Build Tauri app and AppImage
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage --verbose

      - name: Collect exactly one artifact
        run: |
          set -euo pipefail
          mkdir -p out
          appimg="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          test -n "$appimg" || { echo "::error::AppImage bundler produced no .AppImage"; exit 1; }
          cp "$appimg" "out/Roan-${APP_VERSION}-x86_64.AppImage"
          chmod +x "out/Roan-${APP_VERSION}-x86_64.AppImage"
          rm -rf src-tauri/target/release/bundle
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/Roan-0.0.1-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- Android --
  # Debug-signed universal APK: installable on a real phone, no keystore secrets.
  android:
    name: Android (.apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - name: Resolve Android SDK / NDK paths
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK not found on runner"; exit 1; }
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "$NDK" || { echo "::error::Android NDK not found on runner"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using SDK=$SDK NDK=$NDK"

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"; fi
          if [ -n "$SDKMGR" ]; then yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true; fi

      - name: Build web UI bundle
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else npm --prefix web install --no-audit --no-fund; fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"

      - name: Generate the Android project
        run: npx --yes @tauri-apps/cli@^2 android init --ci

      - name: Generate launcher icons for Android
        run: |
          set -euo pipefail
          npx --yes @tauri-apps/cli@^2 icon src-tauri/icons/icon-1024.png
          RES=src-tauri/gen/android/app/src/main/res
          mkdir -p "$RES/values"
          cp -R src-tauri/icons/mipmap-* "$RES"/ 2>/dev/null || true
          find src-tauri/icons -name ic_launcher_background.xml -exec cp {} "$RES/values/" \; 2>/dev/null || true
          find "$RES" -name 'ic_launcher*' | sort

      - name: Build debug APK
        run: npx --yes @tauri-apps/cli@^2 android build --apk --debug --ci

      - name: Collect exactly one artifact
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | grep -i debug | head -n 1 || true)"
          if [ -z "$apk" ]; then apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"; fi
          test -n "$apk" || { echo "::error::Gradle produced no .apk"; exit 1; }
          cp "$apk" "out/Roan-${APP_VERSION}.apk"
          rm -rf src-tauri/gen/android/app/build/outputs
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/Roan-0.0.1.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- Release --
  # Publishes a release containing exactly four files and nothing else.
  release:
    name: Publish release
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the app version
        run: |
          set -euo pipefail
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=${GITHUB_REF_NAME} config=${conf}"
          if [ "${GITHUB_REF_NAME}" != "v${conf}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${conf}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Keep only the four release files
        run: |
          set -euo pipefail
          cd release
          expected="Roan-0.0.1-x64.exe Roan-0.0.1-arm64.dmg Roan-0.0.1-x86_64.AppImage Roan-0.0.1.apk"
          for f in *; do
            case " $expected " in
              *" $f "*) ;;
              *) echo "removing stray file: $f"; rm -rf "$f" ;;
            esac
          done
          for f in $expected; do
            [ -f "$f" ] || { echo "::error::missing expected asset $f"; exit 1; }
          done
          echo "release assets:"; ls -l

      - name: Delete an existing release for this tag (re-runs must not accumulate assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Create release with the four artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Roan ${{ github.ref_name }}
          body: |
            Roan 0.0.1 - first public build.

            Unsigned builds: macOS shows a Gatekeeper prompt on first open
            (right click -> Open). The APK is debug-signed and installs with
            "install unknown apps" enabled.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/Roan-0.0.1-x64.exe
            release/Roan-0.0.1-arm64.dmg
            release/Roan-0.0.1-x86_64.AppImage
            release/Roan-0.0.1.apk