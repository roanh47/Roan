name: Release dry run

# Manual dry run of the release pipeline: builds the same four artifacts as
# release.yml, uploads them as workflow artifacts, and publishes nothing.
# No tag check, no GitHub release, no gh release calls.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

concurrency:
  group: release-dry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build web UI bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then
            npm --prefix web ci --no-audit --no-fund
          else
            npm --prefix web install --no-audit --no-fund
          fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"

      - name: Build Tauri app and NSIS installer
        shell: bash
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis --verbose

      - name: Collect the installer
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p out
          exe="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' | head -n 1)"
          test -n "$exe" || { echo "::error::NSIS produced no .exe"; exit 1; }
          cp "$exe" "out/Roan-${APP_VERSION}-x64.exe"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/Roan-*-x64.exe
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ macOS --
  macos:
    name: macOS Apple Silicon (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-arm64

      - name: Build web UI bundle
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else npm --prefix web install --no-audit --no-fund; fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"

      - name: Build Tauri app and DMG (unsigned)
        run: npx --yes @tauri-apps/cli@^2 build --target aarch64-apple-darwin --bundles dmg --verbose

      - name: Collect the DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p out
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$dmg" || { echo "::error::DMG bundler produced no .dmg"; exit 1; }
          cp "$dmg" "out/Roan-${APP_VERSION}-arm64.dmg"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/Roan-*-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ Linux --
  linux:
    name: Linux x86_64 (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install WebKitGTK and AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf libfuse2 file xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: linux-x86_64

      - name: Build web UI bundle
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else npm --prefix web install --no-audit --no-fund; fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"

      - name: Build Tauri app and AppImage
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage --verbose

      - name: Collect the AppImage
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p out
          appimg="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          test -n "$appimg" || { echo "::error::AppImage bundler produced no .AppImage"; exit 1; }
          cp "$appimg" "out/Roan-${APP_VERSION}-x86_64.AppImage"
          chmod +x "out/Roan-${APP_VERSION}-x86_64.AppImage"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/Roan-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- Android --
  android:
    name: Android (.apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - name: Resolve Android SDK / NDK paths
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK not found on runner"; exit 1; }
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "$NDK" || { echo "::error::Android NDK not found on runner"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using SDK=$SDK NDK=$NDK"

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"; fi
          if [ -n "$SDKMGR" ]; then yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true; fi

      - name: Build web UI bundle
        run: |
          set -euo pipefail
          test -f web/package.json || { echo "::error::web/package.json is missing - the web frontend is not scaffolded yet"; exit 1; }
          if [ -f web/package-lock.json ]; then npm --prefix web ci --no-audit --no-fund; else npm --prefix web install --no-audit --no-fund; fi
          npm --prefix web run build

      - name: Verify UI is bundled (not served from a dev server)
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing - the app would open blank"; exit 1; }
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.build && c.build.devUrl){console.error('::error::build.devUrl is set; production must use frontendDist only');process.exit(1)}"

      - name: Generate the Android project
        run: npx --yes @tauri-apps/cli@^2 android init --ci

      - name: Generate launcher icons for Android
        run: |
          set -euo pipefail
          npx --yes @tauri-apps/cli@^2 icon src-tauri/icons/icon-1024.png
          RES=src-tauri/gen/android/app/src/main/res
          mkdir -p "$RES/values"
          cp -R src-tauri/icons/mipmap-* "$RES"/ 2>/dev/null || true
          find src-tauri/icons -name ic_launcher_background.xml -exec cp {} "$RES/values/" \; 2>/dev/null || true
          find "$RES" -name 'ic_launcher*' | sort

      - name: Build debug APK
        run: npx --yes @tauri-apps/cli@^2 android build --apk --debug --ci

      - name: Collect the APK
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | grep -i debug | head -n 1 || true)"
          if [ -z "$apk" ]; then apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"; fi
          test -n "$apk" || { echo "::error::Gradle produced no .apk"; exit 1; }
          cp "$apk" "out/Roan-${APP_VERSION}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/Roan-*.apk
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------- Verify the bundle --
  # Downloads what was uploaded and asserts the four expected files are there.
  # Publishes nothing.
  verify:
    name: Verify four artifacts
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assert exactly the four release files exist
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          expected="Roan-${version}-x64.exe Roan-${version}-arm64.dmg Roan-${version}-x86_64.AppImage Roan-${version}.apk"
          echo "Downloaded:"
          ls -lR artifacts
          for f in $expected; do
            test -f "artifacts/$f" || { echo "::error::missing artifact $f"; exit 1; }
          done
          for f in artifacts/*; do
            case " $expected " in
              *" $(basename "$f") "*) ;;
              *) echo "::error::unexpected artifact $(basename "$f")"; exit 1 ;;
            esac
          done
          echo "All four artifacts present: $expected"
