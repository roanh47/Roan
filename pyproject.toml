[project]
name = "roan"
version = "0.2.0rc1"
description = "Roan — a terminal-based agent harness"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "rich>=13.7",
    "textual>=0.52",
    "pillow>=10.0",
    "packaging>=23.0",
    "textual-image[textual]",
]

[project.scripts]
roan = "roan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["roan"]

[tool.setuptools.package-data]
roan = ["assets/*.png", "assets/*.jpg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]